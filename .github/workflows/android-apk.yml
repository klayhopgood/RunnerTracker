name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Capacitor deps
        run: npm ci
        working-directory: native

      - name: Sync native project
        run: npx cap sync android
        working-directory: native

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: native/android

      - uses: actions/upload-artifact@v4
        with:
          name: runnertracker-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk

      # Rolling prerelease so the APK is downloadable from a stable public link
      # (GitHub artifacts require login; release assets don't).
      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: RunnerTracker Android (latest)
          prerelease: true
          files: native/android/app/build/outputs/apk/debug/app-debug.apk
